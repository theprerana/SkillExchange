<!DOCTYPE html>
<html>
<head>

<title>Matching Students</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    background-image:url("/static/images/register_bg.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    min-height:100vh;

    padding:50px;

}

.container{

    width:90%;

    margin:auto;

    background:rgba(255,255,255,0.95);

    padding:40px;

    border-radius:20px;

    box-shadow:0px 10px 30px rgba(0,0,0,0.2);

}

h1{

    text-align:center;

    color:#24135F;

    margin-bottom:40px;

    font-size:40px;

}

table{

    width:100%;

    border-collapse:collapse;

    overflow:hidden;

    border-radius:15px;

}

th{

    background:#24135F;

    color:white;

    padding:18px;

    font-size:18px;

}

td{

    padding:20px;

    text-align:center;

    border-bottom:1px solid #ddd;

}

tr:hover{

    background:#f8f9fc;

}

.skill{

    display:inline-block;

    background:#edf2ff;

    color:#24135F;

    padding:8px 15px;

    border-radius:20px;

    margin:4px;

    font-weight:500;

}

.percent{

    color:green;

    font-size:18px;

    font-weight:700;

}

.send{

    background:#24135F;

    color:white;

    border:none;

    padding:12px 22px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

}

.send:hover{

    background:#3b2a88;

}

.sent{

    background:red;

    color:white;

    border:none;

    padding:12px 22px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;

}

.sent:hover{

    background:#d40000;

}

</style>

</head>

<body>

<div class="container">

<h1>

Matching Students

</h1>

<table>

<tr>

<th>

Name

</th>

<th>

Skills They Can Teach

</th>

<th>

Match Percentage

</th>

<th>

Status

</th>

</tr>


{% for student in matches %}

<tr>

<td>

{{student.name}}

</td>


<td>

{% for skill in student.skills %}

<span class="skill">

{{skill}}

</span>

{% endfor %}

</td>


<td class="percent">

{{student.percentage}}%

</td>


<td>

<form action="/send_request/{{student.id}}" method="POST">

{% if student.id in sent_requests %}

<button class="sent">

Request Sent

</button>

{% else %}

<button class="send">

Send Request

</button>

{% endif %}

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
```
