<!DOCTYPE html>
<html>

<head>

<title>Connections</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background-image:url("/static/bg.jpg");
background-size:cover;
background-position:center;

min-height:100vh;

padding:50px;

}

.container{

width:90%;

margin:auto;

background:rgba(255,255,255,0.95);

padding:40px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

h1{

text-align:center;

color:#24135F;

margin-bottom:40px;

font-size:40px;

}

table{

width:100%;

border-collapse:collapse;

}

th{

background:#24135F;

color:white;

padding:18px;

}

td{

padding:20px;

text-align:center;

border-bottom:1px solid #ddd;

}

tr:hover{

background:#f8f9fc;

}

.chat{

background:#24135F;

color:white;

border:none;

padding:12px 22px;

border-radius:10px;

cursor:pointer;

font-size:15px;

}

.chat:hover{

background:#3d248d;

}

</style>

</head>

<body>

<div class="container">

<h1>

Connections

</h1>

<table>

<tr>

<th>Name</th>

<th>Email</th>

<th>Department</th>

<th>Chat</th>

</tr>

{% for student in connections %}

<tr>

<td>

{{student.name}}

</td>

<td>

{{student.email}}

</td>

<td>

{{student.department}}

</td>

<td>

<form action="/chat/{{student.id}}">

<button class="chat">

Chat

</button>

</form>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
```
