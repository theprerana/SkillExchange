<!DOCTYPE html>
<html>

<head>

<title>My Skills</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background-image:url("/static/bg.jpg");
background-size:cover;
background-position:center;

min-height:100vh;

padding:50px;

}

.container{

width:90%;

margin:auto;

background:rgba(255,255,255,0.95);

padding:40px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,0.2);

}

h1{

text-align:center;

color:#24135F;

margin-bottom:40px;

font-size:40px;

}

table{

width:100%;

border-collapse:collapse;

}

th{

background:#24135F;

color:white;

padding:18px;

}

td{

padding:20px;

text-align:center;

border-bottom:1px solid #ddd;

}

tr:hover{

background:#f8f9fc;

}

.empty{

text-align:center;

color:#666;

padding:30px;

}

.actions{

text-align:center;

margin-top:30px;

}

.btn{

display:inline-block;

background:#24135F;

color:white;

text-decoration:none;

padding:12px 22px;

border-radius:10px;

margin:0 6px;

font-size:15px;

}

.btn:hover{

background:#3d248d;

}

</style>

</head>

<body>

<div class="container">

<h1>

My Skills

</h1>

{% if skills %}

<table>

<tr>

<th>Skill</th>

<th>Type</th>

</tr>

{% for skill in skills %}

<tr>

<td>

{{skill.skill_name}}

</td>

<td>

{{skill.skill_type}}

</td>

</tr>

{% endfor %}

</table>

{% else %}

<p class="empty">

You have not added any skills yet.

</p>

{% endif %}

<div class="actions">

<a class="btn" href="/add_skill">Manage Skills</a>

<a class="btn" href="/dashboard">Dashboard</a>

</div>

</div>

{% if session.get('student_id') %}
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/call_listener.js" data-student-id="{{ session.get('student_id') }}"></script>
{% endif %}
</body>

</html>
