<!DOCTYPE html>
<html>
<head>

<title>Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<!-- Jitsi -->
<script src="https://meet.jit.si/external_api.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-image: url("/static/bg.jpg");
    background-size: cover;
    background-position: center;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.chat-container {
    width: 700px;
    height: 700px;

    background: white;
    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0,0,0,0.2);

    display: flex;
    flex-direction: column;

    overflow: hidden;
}

/* HEADER */

.header {
    background: #24135F;
    color: white;

    padding: 20px;

    font-size: 24px;
    font-weight: 600;
}

/* MESSAGES */

.messages {
    flex: 1;

    padding: 20px;

    overflow-y: auto;

    background: #f4f4f4;
}

.sent {
    background: #24135F;
    color: white;

    padding: 12px 18px;

    border-radius: 15px;

    width: max-content;

    margin-left: auto;
    margin-bottom: 15px;

    max-width: 70%;
}

.received {
    background: white;

    padding: 12px 18px;

    border-radius: 15px;

    margin-bottom: 15px;

    max-width: 70%;

    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* MESSAGE INPUT */

.input-area {
    display: flex;

    padding: 15px 20px;

    background: white;

    gap: 15px;
}

input {
    flex: 1;

    padding: 15px;

    border: 1px solid #ddd;

    border-radius: 12px;

    font-size: 16px;
}

button {
    background: #24135F;

    color: white;

    border: none;

    padding: 15px 25px;

    border-radius: 12px;

    cursor: pointer;
}

/* VIDEO CALL BUTTON */

.call-button {
    margin: 0 20px 15px 20px;

    width: calc(100% - 40px);

    background: #16a34a;

    font-size: 16px;

    font-weight: 600;
}

.call-button:hover {
    background: #15803d;
}

/* CALL STATUS */

.call-status {
    display: none;

    margin: 0 20px 15px 20px;

    padding: 10px;

    background: #f3f4f6;

    border-radius: 10px;

    text-align: center;

    font-size: 14px;
}

/* JITSI */

#jitsi-container {
    display: none;

    width: calc(100% - 40px);

    height: 400px;

    margin: 0 20px 20px 20px;

    border-radius: 12px;

    overflow: hidden;
}

/* ==================================================
   INCOMING CALL POPUP
   ================================================== */

#incoming-call-overlay {

    display: none;

    position: fixed;

    top: 0;
    left: 0;
    right: 0;
    bottom: 0;

    background: rgba(0,0,0,0.55);

    z-index: 9999;

    justify-content: center;
    align-items: center;
}

.incoming-call-box {

    background: white;

    width: 360px;

    padding: 30px;

    border-radius: 20px;

    box-shadow: 0 15px 50px rgba(0,0,0,0.35);

    text-align: center;
}

.incoming-call-icon {

    font-size: 50px;

    margin-bottom: 10px;

    animation: ring 1s infinite;
}

@keyframes ring {

    0%,100% {
        transform: rotate(0deg);
    }

    25% {
        transform: rotate(-12deg);
    }

    75% {
        transform: rotate(12deg);
    }
}

.incoming-call-box h2 {

    color: #24135F;

    margin-bottom: 8px;
}

.incoming-call-box p {

    color: #666;

    margin-bottom: 20px;
}

.accept-button {

    background: #16a34a;

    margin-right: 8px;
}

.accept-button:hover {

    background: #15803d;
}

.reject-button {

    background: #dc2626;
}

.reject-button:hover {

    background: #b91c1c;
}

</style>

</head>


<body>


<div class="chat-container">


    <!-- HEADER -->

    <div class="header">

        Chat

    </div>


    <!-- MESSAGES -->

    <div class="messages">

        {% for msg in messages %}

            {% if msg.sender_id == session['student_id'] %}

                <div class="sent">

                    {{ msg.message }}

                </div>

            {% else %}

                <div class="received">

                    {{ msg.message }}

                </div>

            {% endif %}

        {% endfor %}

    </div>


    <!-- MESSAGE FORM -->

    <form method="POST" class="input-area">

        <input
            type="text"
            name="message"
            placeholder="Type your message..."
            required
        >

        <button type="submit">

            Send

        </button>

    </form>


    <!-- START CALL -->

    <button
        type="button"
        class="call-button"
        onclick="startCall()"
    >

        📹 Start Video Call

    </button>


    <!-- CALL STATUS -->

    <div
        id="call-status"
        class="call-status"
    >

    </div>


    <!-- JITSI -->

    <div id="jitsi-container">

    </div>


</div>


<!-- ==================================================
     INCOMING CALL POPUP
     ================================================== -->

<div id="incoming-call-overlay">


    <div class="incoming-call-box">


        <div class="incoming-call-icon">

            📞

        </div>


        <h2>

            Incoming Video Call

        </h2>


        <p id="caller-text">

            Someone is calling you...

        </p>


        <button
            type="button"
            class="accept-button"
            onclick="acceptCall()"
        >

            ✅ Accept

        </button>


        <button
            type="button"
            class="reject-button"
            onclick="rejectCall()"
        >

            ❌ Reject

        </button>


    </div>

</div>


<script>

/* ==================================================
   SOCKET.IO CONNECTION
   ================================================== */

const socket = io();


/* Current chat receiver */

const receiverId = {{ receiver_id|tojson }};


/* Logged-in student */

const myStudentId = {{ session['student_id']|tojson }};


/* Call variables */

let currentCallId = null;

let currentRoomName = null;

let jitsiApi = null;


/* ==================================================
   CALL STATUS
   ================================================== */

function showCallStatus(message) {

    const status =
        document.getElementById("call-status");

    status.style.display = "block";

    status.innerText = message;
}


function hideCallStatus() {

    document.getElementById(
        "call-status"
    ).style.display = "none";
}


/* ==================================================
   STUDENT A
   START CALL
   ================================================== */

function startCall() {

    if (currentCallId) {

        return;

    }


    currentCallId = "calling";


    showCallStatus("📞 Calling...");


    socket.emit(
        "start_call",
        {
            receiver_id: receiverId
        }
    );

}


/* ==================================================
   STUDENT B
   INCOMING CALL
   ================================================== */

socket.on(
    "incoming_call",
    function(data) {


        currentCallId =
            data.call_id;


        currentRoomName =
            data.room_name;


        document.getElementById(
            "caller-text"
        ).innerText =
            data.caller_name +
            " is calling you...";


        document.getElementById(
            "incoming-call-overlay"
        ).style.display = "flex";

    }
);


/* ==================================================
   STUDENT B
   ACCEPT CALL
   ================================================== */

function acceptCall() {


    if (!currentCallId) {

        return;

    }


    document.getElementById(
        "incoming-call-overlay"
    ).style.display = "none";


    showCallStatus(
        "📹 Connecting video call..."
    );


    socket.emit(
        "accept_call",
        {
            call_id: currentCallId
        }
    );

}


/* ==================================================
   STUDENT B
   REJECT CALL
   ================================================== */

function rejectCall() {


    if (!currentCallId) {

        return;

    }


    document.getElementById(
        "incoming-call-overlay"
    ).style.display = "none";


    socket.emit(
        "reject_call",
        {
            call_id: currentCallId
        }
    );


    currentCallId = null;

    currentRoomName = null;


    hideCallStatus();

}


/* ==================================================
   STUDENT A
   RECEIVER ACCEPTED
   ================================================== */

socket.on(
    "call_accepted",
    function(data) {


        currentCallId =
            data.call_id;


        currentRoomName =
            data.room_name;


        showCallStatus(
            "📹 Video call connected"
        );


        startJitsiCall(
            data.room_name
        );

    }
);


/* ==================================================
   STUDENT B
   CALL CONNECTED
   ================================================== */

socket.on(
    "call_connected",
    function(data) {


        currentCallId =
            data.call_id;


        currentRoomName =
            data.room_name;


        showCallStatus(
            "📹 Video call connected"
        );


        startJitsiCall(
            data.room_name
        );

    }
);


/* ==================================================
   STUDENT A
   CALL REJECTED
   ================================================== */

socket.on(
    "call_rejected",
    function(data) {


        if (
            currentCallId !==
            data.call_id &&
            currentCallId !== "calling"
        ) {

            return;

        }


        currentCallId = null;

        currentRoomName = null;


        showCallStatus(
            "❌ Call rejected"
        );


        setTimeout(
            function() {

                hideCallStatus();

            },
            3000
        );

    }
);


/* ==================================================
   ALREADY CALLING
   ================================================== */

socket.on(
    "call_already_ringing",
    function(data) {


        currentCallId =
            data.call_id;


        showCallStatus(
            "📞 Already calling..."
        );

    }
);


/* ==================================================
   JITSI
   ================================================== */

function startJitsiCall(roomName) {


    const container =
        document.getElementById(
            "jitsi-container"
        );


    container.style.display =
        "block";


    if (jitsiApi !== null) {

        return;

    }


    jitsiApi =
        new JitsiMeetExternalAPI(
            "meet.jit.si",
            {

                roomName:
                    roomName,

                parentNode:
                    container,

                width:
                    "100%",

                height:
                    "400px",


                configOverwrite: {

                    startWithAudioMuted:
                        false,

                    startWithVideoMuted:
                        false

                },


                interfaceConfigOverwrite: {

                    SHOW_JITSI_WATERMARK:
                        false,

                    SHOW_WATERMARK_FOR_GUESTS:
                        false,

                    TOOLBAR_BUTTONS: [

                        "microphone",

                        "camera",

                        "chat",

                        "desktop",

                        "fullscreen",

                        "hangup"

                    ]

                }

            }
        );

}

</script>


</body>

</html>
